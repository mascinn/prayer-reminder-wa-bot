# fly.toml app configuration file generated for Masjid Al-Wasii WhatsApp Reminder Bot

app = "masjid-alwasii-remind-bot"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  TIMEZONE = "Asia/Jakarta"
  DB_PATH = "/data/bot.db"
  ENABLE_JUMAT_REMINDER = "false"
  CITY_ID = "1014"
  LOG_LEVEL = "INFO"

[mounts]
  source = "remind_bot_data"
  destination = "/data"
  initial_size = "1GB"

# 24/7 background worker bot configuration (No public HTTP services needed)
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
